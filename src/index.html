<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src corta-media:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title></title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="titlebar" aria-hidden="true"></div>
  <main>
    <header>
      <h1 data-text="appName"></h1>
      <div class="toolbar">
        <div class="language-control"><span lang="es">ES</span><button id="language-switch" type="button" role="switch" aria-checked="false" data-text-aria-label="languageSwitchLabel"><span></span></button><span lang="en">EN</span></div>
        <button id="open" class="button secondary" data-text-title="openShortcut"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h7l2 2h9v10H3zM3 7V5h7l2 2"/></svg><span data-text="open"></span></button>
      </div>
    </header>
    <section class="editor" data-text-aria-label="editorLabel">
      <div id="file-row" class="file-row" hidden><div class="file-details"><strong id="filename"></strong><span id="filemeta"></span></div><button id="reset" class="text-button" disabled data-text-title="resetTitle" data-text="reset"></button></div>
      <div class="wave-area">
        <div id="wave" class="wave" data-text-aria-label="waveLabel">
          <canvas id="canvas"></canvas>
          <div id="selection" class="selection" hidden></div>
          <div id="playhead" class="playhead" hidden><span></span></div>
          <button id="handle-start" class="handle" role="slider" data-text-aria-label="startHandleLabel" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" hidden><span></span></button>
          <button id="handle-end" class="handle" role="slider" data-text-aria-label="endHandleLabel" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" hidden><span></span></button>
          <div id="empty" class="empty" data-text="dropTitle"></div>
        </div>
        <div id="ruler" class="ruler" aria-hidden="true"></div>
      </div>
      <div class="selection-info">
        <div class="time-field"><label for="start-time" data-text="start"></label><input id="start-time" type="text" inputmode="decimal" value="0:00.000" data-text-aria-label="startInputLabel" disabled spellcheck="false"></div>
        <div class="time-field"><label for="end-time" data-text="end"></label><input id="end-time" type="text" inputmode="decimal" value="0:00.000" data-text-aria-label="endInputLabel" disabled spellcheck="false"></div>
        <div class="duration"><span data-text="selectedDuration"></span><strong id="duration" data-text="emptyDuration"></strong></div>
      </div>
    </section>
    <section class="actions">
      <button id="play" class="button play" disabled data-text-title="playShortcut"><svg id="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 11 7-11 7z"/></svg><span id="play-label" data-text="play"></span></button>
      <button id="save" class="button primary" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 16v5h16v-5"/></svg><span id="save-label" data-text="save"></span></button>
    </section>
    <div id="status" class="status" role="status" aria-live="polite" hidden></div>
  </main>
  <audio id="audio" preload="auto"></audio>
  <script src="format-text.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
